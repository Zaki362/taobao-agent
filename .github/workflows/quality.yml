name: quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scenecart
          POSTGRES_PASSWORD: scenecart
          POSTGRES_DB: scenecart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenecart -d scenecart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scenecart:scenecart@127.0.0.1:5432/scenecart_test
      DATABASE_SSL: "false"
      DEEPSEEK_API_KEY: ""
      DEEPSEEK_DISABLED: "true"
      TAOBAO_EXECUTION_BACKEND: local_executor

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run test:unit
      - run: npm run eval:agent
      - run: npm run test:integration
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
